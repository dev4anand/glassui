<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movable Liquid Glass Lenses</title>

    <!-- Glass Texture & Lens Stylesheet -->
    <link rel="stylesheet" href="glass.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fullscreen canvas rendering the wallpaper */
        #screen {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Both liquid-glass shapes support mouse and touch dragging */
        .draggable-glass {
            /* Keep the demo lenses as fixed-position overlays; .glass itself is layout-neutral. */
            position: fixed;
            z-index: 10;
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .draggable-glass.is-dragging {
            cursor: grabbing;
        }

        /* Keep the square as the main, centered lens */
        #glass {
            width: 220px;
            height: 220px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10%;
        }

        /* Shared appearance for both showcase circles */
        .liquid-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            z-index: 11;
        }

        /* Initial positions; the showcase physics script takes over at runtime. */
        #glass-circle {
            left: calc(50% + 190px);
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #glass-circle-2 {
            left: 25%;
            top: 72%;
            transform: translate(-50%, -50%);
        }

        @media (max-width: 600px) {
            #glass-circle {
                left: 50%;
                top: calc(50% + 190px);
            }

            #glass-circle-2 {
                left: 25%;
                top: 25%;
            }
        }
    </style>
</head>

<body>

    <!-- Wallpaper source -->
    <img id="wallpaper" src="./wallpaper.png" alt="" style="display:none;">

    <!-- Background screen canvas -->
    <canvas id="screen"></canvas>

    <!-- Movable square liquid-glass lens -->
    <div class="glass draggable-glass" id="glass" aria-label="Movable square liquid glass lens"></div>

    <!-- Movable circular liquid-glass lenses; both share the same glass engine -->
    <div class="glass draggable-glass liquid-circle" id="glass-circle" glass-edge="42%" glass-shape="circle" aria-label="First movable circular liquid glass lens"></div>
    <div class="glass draggable-glass liquid-circle" id="glass-circle-2" glass-edge="42%" glass-shape="circle" aria-label="Second movable circular liquid glass lens"></div>

    <!-- Glass Refraction & Behavior Engine -->
    <script src="glass.js"></script>

    <script>
        (() => {
            const lenses = Array.from(document.querySelectorAll(".draggable-glass"));
            if (!lenses.length) return;

            lenses.forEach((lens) => {
                let activePointerId = null;
                let pointerOffsetX = 0;
                let pointerOffsetY = 0;
                let renderFrame = null;

                lens.addEventListener("pointerdown", (event) => {
                    // Only begin a drag with the primary mouse button or a touch.
                    if (activePointerId !== null ||
                        (event.pointerType === "mouse" && event.button !== 0)) {
                        return;
                    }

                    const rect = lens.getBoundingClientRect();
                    activePointerId = event.pointerId;
                    pointerOffsetX = event.clientX - rect.left;
                    pointerOffsetY = event.clientY - rect.top;

                    // Convert the initial centered position into pixel coordinates
                    // without visually moving the lens on pointer down.
                    lens.style.left = rect.left + "px";
                    lens.style.top = rect.top + "px";
                    lens.style.transform = "none";
                    lens.classList.add("is-dragging");

                    try {
                        lens.setPointerCapture(event.pointerId);
                    } catch (_) {
                        // Pointer capture may be unavailable in some older browsers.
                    }

                    event.preventDefault();
                });

                lens.addEventListener("pointermove", (event) => {
                    if (event.pointerId !== activePointerId) return;

                    const rect = lens.getBoundingClientRect();
                    const maxLeft = Math.max(0, window.innerWidth - rect.width);
                    const maxTop = Math.max(0, window.innerHeight - rect.height);
                    const left = Math.min(maxLeft, Math.max(0, event.clientX - pointerOffsetX));
                    const top = Math.min(maxTop, Math.max(0, event.clientY - pointerOffsetY));

                    lens.style.left = left + "px";
                    lens.style.top = top + "px";

                    // Repaint refraction at the new position at most once per frame.
                    if (renderFrame === null) {
                        renderFrame = requestAnimationFrame(() => {
                            renderFrame = null;
                            if (window.Glass && typeof window.Glass.render === "function") {
                                window.Glass.render(lens);
                            }
                        });
                    }

                    event.preventDefault();
                });

                function stopDragging(event) {
                    if (event.pointerId !== activePointerId) return;

                    activePointerId = null;
                    lens.classList.remove("is-dragging");

                    if (renderFrame !== null) {
                        cancelAnimationFrame(renderFrame);
                        renderFrame = null;
                    }

                    if (window.Glass && typeof window.Glass.render === "function") {
                        window.Glass.render(lens);
                    }
                }

                lens.addEventListener("pointerup", stopDragging);
                lens.addEventListener("pointercancel", stopDragging);
                lens.addEventListener("lostpointercapture", (event) => {
                    if (event.pointerId === activePointerId) {
                        activePointerId = null;
                        lens.classList.remove("is-dragging");
                    }
                });
            });

            // Keep any lens that has been moved inside the viewport after resize/rotation.
            window.addEventListener("resize", () => {
                lenses.forEach((lens) => {
                    const rect = lens.getBoundingClientRect();
                    if (lens.style.transform !== "none") return;

                    lens.style.left = Math.min(
                        Math.max(0, rect.left),
                        Math.max(0, window.innerWidth - rect.width)
                    ) + "px";
                    lens.style.top = Math.min(
                        Math.max(0, rect.top),
                        Math.max(0, window.innerHeight - rect.height)
                    ) + "px";
                });
            });
        })();
    </script>

    <!-- Showcase-only motion/collision demo. Remove this script to return to static, draggable lenses. -->
    <script>
        (() => {
            const circles = Array.from(document.querySelectorAll(".liquid-circle"));
            if (circles.length < 2) return;

            const randomBetween = (min, max) => min + Math.random() * (max - min);
            const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

            const states = circles.map((element, index) => {
                const rect = element.getBoundingClientRect();
                const width = rect.width || 150;
                const height = rect.height || 150;
                const maxX = Math.max(0, window.innerWidth - width);
                const maxY = Math.max(0, window.innerHeight - height);
                element.style.transform = "none";

                // Start in separated areas, with a little random variation.
                const x = clamp(
                    (index === 0 ? window.innerWidth * 0.20 : window.innerWidth * 0.72) -
                        width / 2 + randomBetween(-20, 20), 0, maxX
                );
                const y = clamp(
                    (index === 0 ? window.innerHeight * 0.28 : window.innerHeight * 0.70) -
                        height / 2 + randomBetween(-20, 20), 0, maxY
                );
                const angle = randomBetween(0, Math.PI * 2);
                const speed = randomBetween(85, 155);

                element.style.left = x + "px";
                element.style.top = y + "px";

                return {
                    element, x, y, width, height,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    wasDragging: false
                };
            });

            function keepInside(state) {
                const maxX = Math.max(0, window.innerWidth - state.width);
                const maxY = Math.max(0, window.innerHeight - state.height);
                if (state.x <= 0) {
                    state.x = 0;
                    if (state.vx < 0) state.vx = Math.abs(state.vx);
                } else if (state.x >= maxX) {
                    state.x = maxX;
                    if (state.vx > 0) state.vx = -Math.abs(state.vx);
                }
                if (state.y <= 0) {
                    state.y = 0;
                    if (state.vy < 0) state.vy = Math.abs(state.vy);
                } else if (state.y >= maxY) {
                    state.y = maxY;
                    if (state.vy > 0) state.vy = -Math.abs(state.vy);
                }
            }

            function collide(a, b) {
                // Let a user drag either circle without the animation fighting back.
                if (a.element.classList.contains("is-dragging") ||
                    b.element.classList.contains("is-dragging")) return;

                const ra = Math.min(a.width, a.height) / 2;
                const rb = Math.min(b.width, b.height) / 2;
                const acx = a.x + a.width / 2;
                const acy = a.y + a.height / 2;
                const bcx = b.x + b.width / 2;
                const bcy = b.y + b.height / 2;
                let dx = bcx - acx;
                let dy = bcy - acy;
                let distance = Math.sqrt(dx * dx + dy * dy);
                const targetDistance = ra + rb;
                if (distance >= targetDistance) return;

                if (distance < 0.001) {
                    const angle = randomBetween(0, Math.PI * 2);
                    dx = Math.cos(angle);
                    dy = Math.sin(angle);
                    distance = 1;
                }

                const nx = dx / distance;
                const ny = dy / distance;
                const overlap = targetDistance - distance;

                // Separate overlapping circles to prevent them sticking together.
                a.x -= nx * overlap / 2;
                a.y -= ny * overlap / 2;
                b.x += nx * overlap / 2;
                b.y += ny * overlap / 2;

                // Equal-mass elastic collision: exchange velocity along the
                // collision normal only when the circles are approaching.
                const closingSpeed = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
                if (closingSpeed > 0) {
                    a.vx -= closingSpeed * nx;
                    a.vy -= closingSpeed * ny;
                    b.vx += closingSpeed * nx;
                    b.vy += closingSpeed * ny;
                }
                keepInside(a);
                keepInside(b);
            }

            let lastFrame = 0;
            function animate(timestamp) {
                const dt = lastFrame
                    ? Math.min((timestamp - lastFrame) / 1000, 0.035)
                    : 0;
                lastFrame = timestamp;

                states.forEach((state) => {
                    const element = state.element;

                    // Pause physics during existing mouse/touch dragging and
                    // resume from the user's final position when released.
                    if (element.classList.contains("is-dragging")) {
                        state.wasDragging = true;
                        return;
                    }
                    if (state.wasDragging) {
                        const rect = element.getBoundingClientRect();
                        state.x = clamp(rect.left, 0, Math.max(0, window.innerWidth - state.width));
                        state.y = clamp(rect.top, 0, Math.max(0, window.innerHeight - state.height));
                        state.wasDragging = false;
                    }

                    state.x += state.vx * dt;
                    state.y += state.vy * dt;
                    keepInside(state);
                });

                collide(states[0], states[1]);

                states.forEach((state) => {
                    if (state.element.classList.contains("is-dragging")) return;
                    state.element.style.left = state.x + "px";
                    state.element.style.top = state.y + "px";
                    if (window.Glass && typeof window.Glass.render === "function") {
                        window.Glass.render(state.element);
                    }
                });

                window.requestAnimationFrame(animate);
            }

            window.addEventListener("resize", () => {
                states.forEach((state) => {
                    const rect = state.element.getBoundingClientRect();
                    state.width = rect.width || state.width;
                    state.height = rect.height || state.height;
                    state.x = clamp(state.x, 0, Math.max(0, window.innerWidth - state.width));
                    state.y = clamp(state.y, 0, Math.max(0, window.innerHeight - state.height));
                    state.element.style.left = state.x + "px";
                    state.element.style.top = state.y + "px";
                });
            });

            window.requestAnimationFrame(animate);
        })();
    </script>

</body>
</html>
