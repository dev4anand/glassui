<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movable Glass Lens</title>

    <!-- Glass Texture & Lens Stylesheet -->
    <link rel="stylesheet" href="glass.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fullscreen canvas rendering the wallpaper */
        #screen {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Mouse and touch dragging for the glass lens */
        #glass {
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #glass.is-dragging {
            cursor: grabbing;
        }
    </style>
</head>

<body>

    <!-- Wallpaper source -->
    <img id="wallpaper" src="./wallpaper.png" alt="" style="display:none;">

    <!-- Background screen canvas -->
    <canvas id="screen"></canvas>

    <!-- Movable glass lens -->
    <div class="glass" id="glass"
        style="width: 220px; height: 220px; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 10%;"
        aria-label="Movable glass lens">
    </div>

    <!-- Glass Refraction & Behavior Engine -->
    <script src="glass.js"></script>

    <script>
        (() => {
            const glass = document.getElementById("glass");
            if (!glass) return;

            let activePointerId = null;
            let pointerOffsetX = 0;
            let pointerOffsetY = 0;
            let renderFrame = null;

            glass.addEventListener("pointerdown", (event) => {
                // Only begin a drag with the primary mouse button or a touch.
                if (activePointerId !== null || (event.pointerType === "mouse" && event.button !== 0)) {
                    return;
                }

                const rect = glass.getBoundingClientRect();
                activePointerId = event.pointerId;
                pointerOffsetX = event.clientX - rect.left;
                pointerOffsetY = event.clientY - rect.top;

                // Convert the initial centered position into pixel coordinates
                // without visually moving the element on pointer down.
                glass.style.left = rect.left + "px";
                glass.style.top = rect.top + "px";
                glass.style.transform = "none";
                glass.classList.add("is-dragging");

                try {
                    glass.setPointerCapture(event.pointerId);
                } catch (_) {
                    // Pointer capture may be unavailable in some older browsers.
                }

                event.preventDefault();
            });

            glass.addEventListener("pointermove", (event) => {
                if (event.pointerId !== activePointerId) return;

                const rect = glass.getBoundingClientRect();
                const maxLeft = Math.max(0, window.innerWidth - rect.width);
                const maxTop = Math.max(0, window.innerHeight - rect.height);
                const left = Math.min(maxLeft, Math.max(0, event.clientX - pointerOffsetX));
                const top = Math.min(maxTop, Math.max(0, event.clientY - pointerOffsetY));

                glass.style.left = left + "px";
                glass.style.top = top + "px";

                // Repaint the refraction at its new location at most once per frame.
                if (renderFrame === null) {
                    renderFrame = requestAnimationFrame(() => {
                        renderFrame = null;
                        if (window.Glass && typeof window.Glass.render === "function") {
                            window.Glass.render(glass);
                        }
                    });
                }

                event.preventDefault();
            });

            function stopDragging(event) {
                if (event.pointerId !== activePointerId) return;

                activePointerId = null;
                glass.classList.remove("is-dragging");

                if (renderFrame !== null) {
                    cancelAnimationFrame(renderFrame);
                    renderFrame = null;
                }

                if (window.Glass && typeof window.Glass.render === "function") {
                    window.Glass.render(glass);
                }
            }

            glass.addEventListener("pointerup", stopDragging);
            glass.addEventListener("pointercancel", stopDragging);
            glass.addEventListener("lostpointercapture", (event) => {
                if (event.pointerId === activePointerId) {
                    activePointerId = null;
                    glass.classList.remove("is-dragging");
                }
            });

            // Keep the lens within the visible viewport after a resize or rotation.
            window.addEventListener("resize", () => {
                if (activePointerId !== null) return;

                const rect = glass.getBoundingClientRect();
                if (glass.style.transform !== "none") return;

                glass.style.left = Math.min(Math.max(0, rect.left), Math.max(0, window.innerWidth - rect.width)) + "px";
                glass.style.top = Math.min(Math.max(0, rect.top), Math.max(0, window.innerHeight - rect.height)) + "px";
            });
        })();
    </script>

</body>
</html>
