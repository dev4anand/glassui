<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movable Liquid Glass Lenses</title>

    <!-- Glass Texture & Lens Stylesheet -->
    <link rel="stylesheet" href="glass.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fullscreen canvas rendering the wallpaper */
        #screen {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Both liquid-glass shapes support mouse and touch dragging */
        .draggable-glass {
            /* Keep the demo lenses as fixed-position overlays; .glass itself is layout-neutral. */
            position: fixed;
            z-index: 10;
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .draggable-glass.is-dragging {
            cursor: grabbing;
        }

        /* Keep the square as the main, centered lens */
        #glass {
            width: 220px;
            height: 220px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10%;
        }

        /* The circle uses the exact same .glass refraction effect */
        #glass-circle {
            width: 150px;
            height: 150px;
            left: calc(50% + 190px);
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 11;

            /* A smaller undistorted center creates a much wider liquid stretch band. */
            --glass-distortion-start: 0.58;
            --glass-shape: circle;
        }

        /* On narrow screens, place the circle below the centered square */
        @media (max-width: 600px) {
            #glass-circle {
                left: 50%;
                top: calc(50% + 190px);
            }
        }
    </style>
</head>

<body>

    <!-- Wallpaper source -->
    <img id="wallpaper" src="./wallpaper.png" alt="" style="display:none;">

    <!-- Background screen canvas -->
    <canvas id="screen"></canvas>

    <!-- Movable square liquid-glass lens -->
    <div class="glass draggable-glass" id="glass" aria-label="Movable square liquid glass lens"></div>

    <!-- Movable circular liquid-glass lens; shares the same glass engine -->
    <div class="glass draggable-glass" id="glass-circle" aria-label="Movable circular liquid glass lens"></div>

    <!-- Glass Refraction & Behavior Engine -->
    <script src="glass.js"></script>

    <script>
        (() => {
            const lenses = Array.from(document.querySelectorAll(".draggable-glass"));
            if (!lenses.length) return;

            lenses.forEach((lens) => {
                let activePointerId = null;
                let pointerOffsetX = 0;
                let pointerOffsetY = 0;
                let renderFrame = null;

                lens.addEventListener("pointerdown", (event) => {
                    // Only begin a drag with the primary mouse button or a touch.
                    if (activePointerId !== null ||
                        (event.pointerType === "mouse" && event.button !== 0)) {
                        return;
                    }

                    const rect = lens.getBoundingClientRect();
                    activePointerId = event.pointerId;
                    pointerOffsetX = event.clientX - rect.left;
                    pointerOffsetY = event.clientY - rect.top;

                    // Convert the initial centered position into pixel coordinates
                    // without visually moving the lens on pointer down.
                    lens.style.left = rect.left + "px";
                    lens.style.top = rect.top + "px";
                    lens.style.transform = "none";
                    lens.classList.add("is-dragging");

                    try {
                        lens.setPointerCapture(event.pointerId);
                    } catch (_) {
                        // Pointer capture may be unavailable in some older browsers.
                    }

                    event.preventDefault();
                });

                lens.addEventListener("pointermove", (event) => {
                    if (event.pointerId !== activePointerId) return;

                    const rect = lens.getBoundingClientRect();
                    const maxLeft = Math.max(0, window.innerWidth - rect.width);
                    const maxTop = Math.max(0, window.innerHeight - rect.height);
                    const left = Math.min(maxLeft, Math.max(0, event.clientX - pointerOffsetX));
                    const top = Math.min(maxTop, Math.max(0, event.clientY - pointerOffsetY));

                    lens.style.left = left + "px";
                    lens.style.top = top + "px";

                    // Repaint refraction at the new position at most once per frame.
                    if (renderFrame === null) {
                        renderFrame = requestAnimationFrame(() => {
                            renderFrame = null;
                            if (window.Glass && typeof window.Glass.render === "function") {
                                window.Glass.render(lens);
                            }
                        });
                    }

                    event.preventDefault();
                });

                function stopDragging(event) {
                    if (event.pointerId !== activePointerId) return;

                    activePointerId = null;
                    lens.classList.remove("is-dragging");

                    if (renderFrame !== null) {
                        cancelAnimationFrame(renderFrame);
                        renderFrame = null;
                    }

                    if (window.Glass && typeof window.Glass.render === "function") {
                        window.Glass.render(lens);
                    }
                }

                lens.addEventListener("pointerup", stopDragging);
                lens.addEventListener("pointercancel", stopDragging);
                lens.addEventListener("lostpointercapture", (event) => {
                    if (event.pointerId === activePointerId) {
                        activePointerId = null;
                        lens.classList.remove("is-dragging");
                    }
                });
            });

            // Keep any lens that has been moved inside the viewport after resize/rotation.
            window.addEventListener("resize", () => {
                lenses.forEach((lens) => {
                    const rect = lens.getBoundingClientRect();
                    if (lens.style.transform !== "none") return;

                    lens.style.left = Math.min(
                        Math.max(0, rect.left),
                        Math.max(0, window.innerWidth - rect.width)
                    ) + "px";
                    lens.style.top = Math.min(
                        Math.max(0, rect.top),
                        Math.max(0, window.innerHeight - rect.height)
                    ) + "px";
                });
            });
        })();
    </script>

</body>
</html>
