<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131c">
    <title>GlassUI — Home</title>
    <link rel="stylesheet" href="./glass.css">
    <style>
        :root {
            color-scheme: dark;
            --line: rgba(255, 255, 255, 0.2);
            --radius: 26px;
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.18);
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; scroll-behavior: smooth; }
        body {
            min-height: 100%;
            margin: 0;
            color: #fff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #10131c;
            overflow-x: hidden;
        }

        #wallpaper { display: none; }
        #screen { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        .wallpaper-shade {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: linear-gradient(180deg, rgba(8, 10, 20, .16), rgba(8, 10, 20, .25) 50%, rgba(8, 10, 20, .42));
        }
        .page-shell { position: relative; z-index: 2; width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
        /* Transparent surfaces use the same pixel-refraction engine as index.html. */
        .glass {
            background: transparent !important;
            border: 1px solid rgba(255, 255, 255, .28);
            box-shadow: inset 0 1px 1px rgba(255,255,255,.28), inset 0 0 18px rgba(255,255,255,.035), 0 18px 60px rgba(0,0,0,.12);
            -webkit-backdrop-filter: none !important;
            backdrop-filter: none !important;
            --glass-refraction: .48;
            --glass-edge: 24%;
        }
        .glass::after {
            content: ""; position: absolute; inset: 1px; border-radius: inherit;
            pointer-events: none; z-index: 3;
            background: linear-gradient(135deg, rgba(255,255,255,.16), transparent 26%, transparent 70%, rgba(255,255,255,.08));
            opacity: .5;
        }
        .glass-canvas { filter: saturate(1.08) contrast(1.02); transition: opacity 90ms linear; }
        /* Avoid displaying stale refracted pixels while the page is moving. */
        body.is-scrolling .glass-canvas { opacity: 0; }
        body.is-scrolling .glass { background: transparent !important; }

        header {
            position: sticky;
            top: 14px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
            margin: 14px auto 0;
            padding: 14px 18px;
            border-radius: 22px;
        }
        .brand-mark {
            width: 38px; height: 38px; flex: 0 0 auto;
            border-radius: 13px;
            background: linear-gradient(135deg, rgba(255,255,255,.8), rgba(255,255,255,.16));
            border: 1px solid rgba(255,255,255,.55);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-lines { display: grid; gap: 6px; width: 100px; }
        .line { display: block; height: 7px; border-radius: 20px; background: rgba(255,255,255,.68); }
        .line.short { width: 58%; opacity: .55; }
        .nav-shapes { display: flex; align-items: center; gap: 9px; }
        .nav-shapes span { display: block; width: 55px; height: 12px; border-radius: 30px; background: rgba(255,255,255,.2); }
        .nav-shapes span:first-child { background: rgba(255,255,255,.58); }
        .header-orb { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); border: 1px solid var(--line); }

        main { padding: 28px 0 70px; }
        section { margin-top: 26px; }
        .hero {
            min-height: 410px;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            align-items: center;
            gap: 34px;
            padding: clamp(26px, 5vw, 58px);
            border-radius: 34px;
        }
        .hero-placeholder { display: grid; gap: 18px; max-width: 480px; }
        .eyebrow { width: 104px; height: 12px; border-radius: 20px; background: rgba(255,255,255,.56); }
        .hero-line { height: clamp(22px, 3vw, 34px); width: 94%; border-radius: 12px; background: rgba(255,255,255,.76); }
        .hero-line:nth-child(3) { width: 72%; opacity: .72; }
        .hero-copy { width: 86%; height: 10px; border-radius: 20px; background: rgba(255,255,255,.27); }
        .hero-copy:last-child { width: 62%; }
        .hero-art {
            min-height: 265px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,.25);
            background: linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.035));
            position: relative;
            overflow: hidden;
        }
        .hero-art::before, .hero-art::after {
            content: ""; position: absolute; border-radius: 50%;
            border: 1px solid rgba(255,255,255,.42);
            background: rgba(255,255,255,.09);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        }
        .hero-art::before { width: 180px; height: 180px; top: 13%; left: 12%; }
        .hero-art::after { width: 118px; height: 118px; right: 10%; bottom: 8%; }

        .section-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 0 4px 16px; }
        .heading-placeholder { width: min(220px, 45%); height: 15px; border-radius: 20px; background: rgba(255,255,255,.64); }
        .heading-placeholder.small { width: 72px; height: 10px; opacity: .55; }
        .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
        .placeholder-card { min-height: 190px; padding: 18px; border-radius: var(--radius); }
        .card-top { height: 98px; border-radius: 17px; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.12); margin-bottom: 17px; }
        .card-line { height: 9px; width: 66%; border-radius: 20px; background: rgba(255,255,255,.58); margin-top: 10px; }
        .card-line.thin { width: 42%; height: 7px; opacity: .45; }

        .carousel-wrap { position: relative; }
        .carousel {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: clamp(225px, 28vw, 310px);
            gap: 18px;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            padding: 4px 2px 20px;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,.55) rgba(255,255,255,.1);
            -webkit-overflow-scrolling: touch;
        }
        .carousel-card {
            min-height: 250px;
            padding: 16px;
            border-radius: var(--radius);
            scroll-snap-align: start;
        }
        .carousel-image { height: 142px; border-radius: 18px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.14); }
        .carousel-card .card-line { width: 76%; }
        .carousel-card .card-line.thin { width: 49%; }

        .wide-panel {
            min-height: 210px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px;
            border-radius: 30px;
        }
        .wide-block { min-height: 160px; border: 1px solid rgba(255,255,255,.17); border-radius: 21px; background: rgba(255,255,255,.08); }
        .stack { display: grid; gap: 14px; align-content: center; padding: 10px; }
        .stack span { display: block; height: 10px; width: 86%; background: rgba(255,255,255,.42); border-radius: 20px; }
        .stack span:nth-child(2) { width: 70%; opacity: .65; }
        .stack span:nth-child(3) { width: 48%; opacity: .42; }

        .tile-strip { display: grid; grid-template-columns: 1.2fr .8fr .8fr; gap: 18px; }
        .tile { min-height: 155px; border-radius: var(--radius); }
        .tile:first-child { min-height: 210px; }

        footer {
            margin-top: 30px;
            padding: 28px;
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
        }
        .footer-mark { width: 96px; height: 10px; border-radius: 20px; background: rgba(255,255,255,.55); }
        .footer-items { display: flex; gap: 10px; }
        .footer-items span { width: 42px; height: 8px; border-radius: 20px; background: rgba(255,255,255,.24); }

        @media (max-width: 760px) {
            .page-shell { width: min(100% - 24px, 560px); }
            header { top: 8px; margin-top: 8px; padding: 11px 13px; }
            .nav-shapes span { width: 26px; }
            .hero { grid-template-columns: 1fr; gap: 24px; min-height: auto; padding: 26px; }
            .hero-art { min-height: 210px; }
            .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .placeholder-card { min-height: 165px; padding: 12px; }
            .card-top { height: 78px; }
            .wide-panel { grid-template-columns: 1fr; }
            .wide-block { min-height: 130px; }
            .tile-strip { grid-template-columns: 1fr 1fr; gap: 12px; }
            .tile:first-child { grid-column: 1 / -1; min-height: 155px; }
            footer { padding: 22px; }
        }
        @media (max-width: 420px) {
            .card-grid { grid-template-columns: 1fr; }
            .placeholder-card { min-height: 155px; }
            .nav-shapes span { width: 18px; height: 9px; }
            .header-lines { width: 74px; }
            .brand-mark { width: 33px; height: 33px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
        }
    </style>
</head>
<body>
    <img id="wallpaper" data-glass-background src="./wallpaper.png" alt="">
    <canvas id="screen" aria-hidden="true"></canvas>
    <div class="wallpaper-shade" aria-hidden="true"></div>

    <div class="page-shell">
        <header class="glass" aria-label="Header">
            <div class="header-left" aria-hidden="true">
                <div class="brand-mark"></div>
                <div class="header-lines"><span class="line"></span><span class="line short"></span></div>
            </div>
            <nav class="nav-shapes" aria-label="Placeholder navigation" aria-hidden="true">
                <span></span><span></span><span></span>
            </nav>
            <div class="header-orb" aria-hidden="true"></div>
        </header>

        <main>
            <section class="hero glass" aria-label="Section">
                <div class="hero-placeholder" aria-hidden="true">
                    <span class="eyebrow"></span>
                    <span class="hero-line"></span>
                    <span class="hero-line"></span>
                    <span class="hero-copy"></span>
                    <span class="hero-copy"></span>
                </div>
                <div class="hero-art" aria-hidden="true"></div>
            </section>

            <section aria-label="Section">
                <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
                <div class="card-grid">
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                </div>
            </section>

            <section aria-label="Section">
                <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
                <div class="carousel" aria-label="Horizontally scrollable carousel">
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                </div>
            </section>

            <section class="wide-panel glass" aria-label="Section">
                <div class="wide-block" aria-hidden="true"></div>
                <div class="stack" aria-hidden="true"><span></span><span></span><span></span></div>
            </section>

            <section aria-label="Section">
                <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
                <div class="tile-strip">
                    <div class="tile glass"></div>
                    <div class="tile glass"></div>
                    <div class="tile glass"></div>
                </div>
            </section>

            <section aria-label="Section">
                <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
                <div class="card-grid">
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                </div>
            </section>
        </main>

        <footer class="glass" aria-label="Footer">
            <span class="footer-mark" aria-hidden="true"></span>
            <div class="footer-items" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="header-orb" aria-hidden="true"></div>
        </footer>
    </div>

    <script src="./glass.js"></script>
    <script>
        (() => {
            const body = document.body;
            const panels = () => Array.from(document.querySelectorAll(".glass"));
            let settleTimer;
            let frame = null;

            // Refract only panels that intersect the viewport, and only after scrolling
            // pauses. This prevents expensive full-resolution pixel work from competing
            // with scroll compositing on older machines.
            function renderVisiblePanels() {
                frame = null;
                if (!window.Glass || typeof window.Glass.render !== "function") return;
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                panels().forEach((panel) => {
                    const rect = panel.getBoundingClientRect();
                    if (rect.bottom < 0 || rect.top > viewportHeight ||
                        rect.right < 0 || rect.left > viewportWidth) return;
                    window.Glass.render(panel);
                });
                body.classList.remove("is-scrolling");
            }

            function scheduleRender() {
                clearTimeout(settleTimer);
                body.classList.add("is-scrolling");
                settleTimer = setTimeout(() => {
                    if (frame !== null) cancelAnimationFrame(frame);
                    frame = requestAnimationFrame(renderVisiblePanels);
                }, 140);
            }

            window.addEventListener("scroll", scheduleRender, { passive: true });
            window.addEventListener("resize", scheduleRender, { passive: true });
            window.addEventListener("load", scheduleRender, { once: true });
            if (window.Glass) window.Glass.setRefraction(0.48);
            scheduleRender();
        })();
    </script>
</body>
</html>
