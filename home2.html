<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131c">
<title>GlassUI — LiquidGlass Layout Demo</title>
<meta name="description" content="A complete dummy website layout using LiquidGlass: transparent header, hero, cards, carousel and footer.">
<style>
:root{color-scheme:dark;--line:rgba(255,255,255,.25);--radius:26px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#10131c url("./wallpaper.png") center/cover fixed no-repeat;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,10,20,.18),rgba(8,10,20,.4))}
.page-shell{width:min(1180px,calc(100% - 40px));margin:0 auto;padding-bottom:36px}
.glass-root{position:relative;isolation:isolate;min-width:0}
.root-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;z-index:-1}
.glass{position:relative;isolation:isolate;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.27);box-shadow:inset 0 1px 1px rgba(255,255,255,.28),inset 0 0 22px rgba(255,255,255,.04),0 18px 55px rgba(0,0,0,.13);backdrop-filter:none;-webkit-backdrop-filter:none;overflow:visible}
.glass:after{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;border:1px solid rgba(255,255,255,.07);z-index:4}
header{position:sticky;top:12px;z-index:20;margin-top:12px;padding:13px 18px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.12));border:1px solid #ffffff80}
.brand-lines{display:grid;gap:6px;width:100px}.line{display:block;height:7px;border-radius:20px;background:#ffffffb5}.line.short{width:58%;opacity:.55}
.nav-shapes{display:flex;gap:9px}.nav-shapes span{width:54px;height:11px;border-radius:20px;background:#ffffff35}.nav-shapes span:first-child{background:#ffffff99}.orb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#ffffff25}
main{padding:25px 0 0}section{margin-top:26px}
.hero{min-height:410px;padding:clamp(26px,5vw,58px);border-radius:34px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:34px}
.hero-placeholder{display:grid;gap:18px;max-width:480px}.eyebrow{width:104px;height:12px;border-radius:20px;background:#ffffff91}.hero-line{height:clamp(22px,3vw,34px);width:94%;border-radius:12px;background:#ffffffc2}.hero-line:nth-child(3){width:72%;opacity:.72}.hero-copy{width:86%;height:10px;border-radius:20px;background:#ffffff45}.hero-copy:last-child{width:62%}
.hero-art{min-height:265px;border-radius:30px;border:1px solid #ffffff40;background:linear-gradient(145deg,#ffffff30,#ffffff08);position:relative;overflow:hidden}.hero-art:before,.hero-art:after{content:"";position:absolute;border-radius:50%;border:1px solid #ffffff70;background:#ffffff18}.hero-art:before{width:180px;height:180px;top:13%;left:12%}.hero-art:after{width:118px;height:118px;right:10%;bottom:8%}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 4px 16px}.heading-placeholder{width:min(220px,45%);height:15px;border-radius:20px;background:#ffffffa6}.heading-placeholder.small{width:72px;height:10px;opacity:.55}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.placeholder-card{min-height:190px;padding:18px;border-radius:var(--radius)}.card-top{height:98px;border-radius:17px;background:#ffffff20;border:1px solid #ffffff20;margin-bottom:17px}.card-line{height:9px;width:66%;border-radius:20px;background:#ffffff91;margin-top:10px}.card-line.thin{width:42%;height:7px;opacity:.45}
.carousel-root{border-radius:22px;padding:2px 0 14px;overflow:hidden}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(225px,28vw,310px);gap:18px;overflow-x:auto;overscroll-behavior-x:contain;padding:4px 2px 20px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#ffffff80 #ffffff18;-webkit-overflow-scrolling:touch}
.carousel-card{min-height:250px;padding:16px;border-radius:var(--radius);scroll-snap-align:start}.carousel-image{height:142px;border-radius:18px;background:#ffffff20;border:1px solid #ffffff20}.carousel-card .card-line{width:76%}.carousel-card .card-line.thin{width:49%}
.wide-panel{min-height:210px;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px;border-radius:30px}.wide-block{min-height:160px;border:1px solid #ffffff2b;border-radius:21px;background:#ffffff14}.stack{display:grid;gap:14px;align-content:center;padding:10px}.stack span{display:block;height:10px;width:86%;background:#ffffff6b;border-radius:20px}.stack span:nth-child(2){width:70%;opacity:.65}.stack span:nth-child(3){width:48%;opacity:.42}
.tile-strip{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:18px}.tile{min-height:155px;border-radius:var(--radius)}.tile:first-child{min-height:210px}
footer{margin-top:30px;padding:28px;border-radius:28px 28px 0 0;display:flex;align-items:center;justify-content:space-between;gap:22px}.footer-mark{width:96px;height:10px;border-radius:20px;background:#ffffff91}.footer-items{display:flex;gap:10px}.footer-items span{width:42px;height:8px;border-radius:20px;background:#ffffff3d}
.note{font-size:12px;color:#ffffffa3;text-align:center;margin:18px 0 0}
@media(max-width:760px){.page-shell{width:calc(100% - 24px)}header{top:8px;padding:11px 13px}.nav-shapes span{width:26px}.hero{grid-template-columns:1fr;gap:24px;min-height:auto;padding:26px}.hero-art{min-height:210px}.card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.placeholder-card{min-height:165px;padding:12px}.card-top{height:78px}.wide-panel{grid-template-columns:1fr}.wide-block{min-height:130px}.tile-strip{grid-template-columns:1fr 1fr;gap:12px}.tile:first-child{grid-column:1/-1;min-height:155px}footer{padding:22px}}
@media(max-width:420px){.card-grid{grid-template-columns:1fr}.placeholder-card{min-height:155px}.nav-shapes span{width:18px;height:9px}.brand-lines{width:74px}.brand-mark{width:33px;height:33px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="page-shell">
  <header class="glass-root">
    <img class="root-bg" src="./wallpaper.png" alt="" crossorigin="anonymous">
    <div class="brand"><div class="brand-mark"></div><div class="brand-lines"><span class="line"></span><span class="line short"></span></div></div>
    <nav class="nav-shapes" aria-label="Decorative navigation"><span></span><span></span><span></span></nav><div class="orb"></div>
  </header>
  <main>
    <section class="hero glass-root">
      <img class="root-bg" src="./wallpaper.png" alt="" crossorigin="anonymous">
      <div class="hero-placeholder" aria-hidden="true"><span class="eyebrow"></span><span class="hero-line"></span><span class="hero-line"></span><span class="hero-copy"></span><span class="hero-copy"></span></div>
      <div class="hero-art" aria-hidden="true"></div>
    </section>
    <section>
      <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
      <div class="card-grid glass-root">
        <img class="root-bg" src="./wallpaper.png" alt="" crossorigin="anonymous">
        <div class="placeholder-card glass"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
        <div class="placeholder-card glass"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
        <div class="placeholder-card glass"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
      </div>
    </section>
    <section>
      <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
      <div class="carousel-root glass-root">
        <img class="root-bg" src="./wallpaper.png" alt="" crossorigin="anonymous">
        <div class="carousel">
          <div class="carousel-card glass"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
          <div class="carousel-card glass"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
          <div class="carousel-card glass"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
          <div class="carousel-card glass"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
          <div class="carousel-card glass"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
        </div>
      </div>
    </section>
    <section class="wide-panel glass-root">
      <img class="root-bg" src="./wallpaper.png" alt="" crossorigin="anonymous">
      <div class="wide-block"></div><div class="stack"><span></span><span></span><span></span></div>
    </section>
    <section>
      <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
      <div class="tile-strip glass-root">
        <img class="root-bg" src="./wallpaper.png" alt="" crossorigin="anonymous">
        <div class="tile glass"></div><div class="tile glass"></div><div class="tile glass"></div>
      </div>
    </section>
    <section>
      <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
      <div class="card-grid glass-root">
        <img class="root-bg" src="./wallpaper.png" alt="" crossorigin="anonymous">
        <div class="placeholder-card glass"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
        <div class="placeholder-card glass"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
        <div class="placeholder-card glass"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
      </div>
    </section>
  </main>
  <footer class="glass-root">
    <img class="root-bg" src="./wallpaper.png" alt="" crossorigin="anonymous">
    <span class="footer-mark"></span><div class="footer-items"><span></span><span></span><span></span><span></span></div><div class="orb"></div>
  </footer>
  <p class="note" id="status">Initializing LiquidGlass…</p>
</div>
<script type="module">
import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js';

const status = document.querySelector('#status');
const roots = [...document.querySelectorAll('.glass-root')];
const instances = [];
try {
  for (const root of roots) {
    const panels = [...root.querySelectorAll(':scope > .glass, :scope > header, :scope > .hero, :scope > footer')];
    // Every panel is a direct child of its own LiquidGlass root; this is required by the library.
    const instance = await LiquidGlass.init({
      root,
      glassElements: panels,
      defaults: { refraction: 0.48, edgeHighlight: 0.08, cornerRadius: 26, opacity: 0.98 }
    });
    instances.push(instance);
  }
  status.textContent = 'LiquidGlass is active on the header, hero, cards, carousel, panels and footer.';
} catch (error) {
  console.error('LiquidGlass initialization failed:', error);
  status.textContent = 'LiquidGlass could not initialize. Check WebGL/CDN access in the browser console.';
  status.style.color = '#ffb7b7';
}
window.addEventListener('beforeunload', () => instances.forEach(instance => instance.destroy()));
</script>
</body>
</html>
