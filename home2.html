<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131c">
    <title>GlassUI — Home 2 (GPU Liquid Glass Test)</title>
    <link rel="stylesheet" href="./glass.css">
    <meta name="description" content="Experimental GPU liquid-glass scrolling test. Original home.html remains unchanged.">
    <style>
        :root {
            color-scheme: dark;
            --line: rgba(255, 255, 255, 0.2);
            --radius: 26px;
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.18);
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; scroll-behavior: smooth; }
        body {
            min-height: 100%;
            margin: 0;
            color: #fff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #10131c url("./wallpaper.png") center center / cover fixed no-repeat;
            overflow-x: hidden;
        }

        #wallpaper { display: none; }
        #glass-gpu { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; display: block; }
        .wallpaper-shade {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: linear-gradient(180deg, rgba(8, 10, 20, .16), rgba(8, 10, 20, .25) 50%, rgba(8, 10, 20, .42));
        }
        .page-shell { position: relative; z-index: 2; width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
        /* Experimental GPU-rendered glass: refraction is drawn in one shared WebGL canvas. */
        .glass {
            background: transparent !important;
            border: 1px solid rgba(255, 255, 255, .28);
            box-shadow: inset 0 1px 1px rgba(255,255,255,.28), inset 0 0 18px rgba(255,255,255,.035), 0 18px 60px rgba(0,0,0,.12);
            -webkit-backdrop-filter: none !important;
            backdrop-filter: none !important;
            --glass-refraction: .48;
            --glass-edge: 24%;
        }
        .glass::after {
            content: ""; position: absolute; inset: 1px; border-radius: inherit;
            pointer-events: none; z-index: 3;
            background: linear-gradient(135deg, rgba(255,255,255,.16), transparent 26%, transparent 70%, rgba(255,255,255,.08));
            opacity: .5;
        }
        

        header {
            position: sticky;
            top: 14px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
            margin: 14px auto 0;
            padding: 14px 18px;
            border-radius: 22px;
        }
        .brand-mark {
            width: 38px; height: 38px; flex: 0 0 auto;
            border-radius: 13px;
            background: linear-gradient(135deg, rgba(255,255,255,.8), rgba(255,255,255,.16));
            border: 1px solid rgba(255,255,255,.55);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-lines { display: grid; gap: 6px; width: 100px; }
        .line { display: block; height: 7px; border-radius: 20px; background: rgba(255,255,255,.68); }
        .line.short { width: 58%; opacity: .55; }
        .nav-shapes { display: flex; align-items: center; gap: 9px; }
        .nav-shapes span { display: block; width: 55px; height: 12px; border-radius: 30px; background: rgba(255,255,255,.2); }
        .nav-shapes span:first-child { background: rgba(255,255,255,.58); }
        .header-orb { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); border: 1px solid var(--line); }

        main { padding: 28px 0 70px; }
        section { margin-top: 26px; }
        .hero {
            min-height: 410px;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            align-items: center;
            gap: 34px;
            padding: clamp(26px, 5vw, 58px);
            border-radius: 34px;
        }
        .hero-placeholder { display: grid; gap: 18px; max-width: 480px; }
        .eyebrow { width: 104px; height: 12px; border-radius: 20px; background: rgba(255,255,255,.56); }
        .hero-line { height: clamp(22px, 3vw, 34px); width: 94%; border-radius: 12px; background: rgba(255,255,255,.76); }
        .hero-line:nth-child(3) { width: 72%; opacity: .72; }
        .hero-copy { width: 86%; height: 10px; border-radius: 20px; background: rgba(255,255,255,.27); }
        .hero-copy:last-child { width: 62%; }
        .hero-art {
            min-height: 265px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,.25);
            background: linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.035));
            position: relative;
            overflow: hidden;
        }
        .hero-art::before, .hero-art::after {
            content: ""; position: absolute; border-radius: 50%;
            border: 1px solid rgba(255,255,255,.42);
            background: rgba(255,255,255,.09);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        }
        .hero-art::before { width: 180px; height: 180px; top: 13%; left: 12%; }
        .hero-art::after { width: 118px; height: 118px; right: 10%; bottom: 8%; }

        .section-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 0 4px 16px; }
        .heading-placeholder { width: min(220px, 45%); height: 15px; border-radius: 20px; background: rgba(255,255,255,.64); }
        .heading-placeholder.small { width: 72px; height: 10px; opacity: .55; }
        .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
        .placeholder-card { min-height: 190px; padding: 18px; border-radius: var(--radius); }
        .card-top { height: 98px; border-radius: 17px; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.12); margin-bottom: 17px; }
        .card-line { height: 9px; width: 66%; border-radius: 20px; background: rgba(255,255,255,.58); margin-top: 10px; }
        .card-line.thin { width: 42%; height: 7px; opacity: .45; }

        .carousel-wrap { position: relative; }
        .carousel {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: clamp(225px, 28vw, 310px);
            gap: 18px;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            padding: 4px 2px 20px;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,.55) rgba(255,255,255,.1);
            -webkit-overflow-scrolling: touch;
        }
        .carousel-card {
            min-height: 250px;
            padding: 16px;
            border-radius: var(--radius);
            scroll-snap-align: start;
        }
        .carousel-image { height: 142px; border-radius: 18px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.14); }
        .carousel-card .card-line { width: 76%; }
        .carousel-card .card-line.thin { width: 49%; }

        .wide-panel {
            min-height: 210px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px;
            border-radius: 30px;
        }
        .wide-block { min-height: 160px; border: 1px solid rgba(255,255,255,.17); border-radius: 21px; background: rgba(255,255,255,.08); }
        .stack { display: grid; gap: 14px; align-content: center; padding: 10px; }
        .stack span { display: block; height: 10px; width: 86%; background: rgba(255,255,255,.42); border-radius: 20px; }
        .stack span:nth-child(2) { width: 70%; opacity: .65; }
        .stack span:nth-child(3) { width: 48%; opacity: .42; }

        .tile-strip { display: grid; grid-template-columns: 1.2fr .8fr .8fr; gap: 18px; }
        .tile { min-height: 155px; border-radius: var(--radius); }
        .tile:first-child { min-height: 210px; }

        footer {
            margin-top: 30px;
            padding: 28px;
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
        }
        .footer-mark { width: 96px; height: 10px; border-radius: 20px; background: rgba(255,255,255,.55); }
        .footer-items { display: flex; gap: 10px; }
        .footer-items span { width: 42px; height: 8px; border-radius: 20px; background: rgba(255,255,255,.24); }

        @media (max-width: 760px) {
            .page-shell { width: min(100% - 24px, 560px); }
            header { top: 8px; margin-top: 8px; padding: 11px 13px; }
            .nav-shapes span { width: 26px; }
            .hero { grid-template-columns: 1fr; gap: 24px; min-height: auto; padding: 26px; }
            .hero-art { min-height: 210px; }
            .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .placeholder-card { min-height: 165px; padding: 12px; }
            .card-top { height: 78px; }
            .wide-panel { grid-template-columns: 1fr; }
            .wide-block { min-height: 130px; }
            .tile-strip { grid-template-columns: 1fr 1fr; gap: 12px; }
            .tile:first-child { grid-column: 1 / -1; min-height: 155px; }
            footer { padding: 22px; }
        }
        @media (max-width: 420px) {
            .card-grid { grid-template-columns: 1fr; }
            .placeholder-card { min-height: 155px; }
            .nav-shapes span { width: 18px; height: 9px; }
            .header-lines { width: 74px; }
            .brand-mark { width: 33px; height: 33px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
        }
    </style>
</head>
<body>
    <img id="wallpaper" data-glass-background src="./wallpaper.png" alt="">
    <canvas id="glass-gpu" aria-hidden="true"></canvas>
    <div class="wallpaper-shade" aria-hidden="true"></div>

    <div class="page-shell">
        <header class="glass" aria-label="Header">
            <div class="header-left" aria-hidden="true">
                <div class="brand-mark"></div>
                <div class="header-lines"><span class="line"></span><span class="line short"></span></div>
            </div>
            <nav class="nav-shapes" aria-label="Placeholder navigation" aria-hidden="true">
                <span></span><span></span><span></span>
            </nav>
            <div class="header-orb" aria-hidden="true"></div>
        </header>

        <main>
            <section class="hero glass" aria-label="Section">
                <div class="hero-placeholder" aria-hidden="true">
                    <span class="eyebrow"></span>
                    <span class="hero-line"></span>
                    <span class="hero-line"></span>
                    <span class="hero-copy"></span>
                    <span class="hero-copy"></span>
                </div>
                <div class="hero-art" aria-hidden="true"></div>
            </section>

            <section aria-label="Section">
                <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
                <div class="card-grid">
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                </div>
            </section>

            <section aria-label="Section">
                <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
                <div class="carousel" aria-label="Horizontally scrollable carousel">
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="carousel-card glass" aria-hidden="true"><div class="carousel-image"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                </div>
            </section>

            <section class="wide-panel glass" aria-label="Section">
                <div class="wide-block" aria-hidden="true"></div>
                <div class="stack" aria-hidden="true"><span></span><span></span><span></span></div>
            </section>

            <section aria-label="Section">
                <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
                <div class="tile-strip">
                    <div class="tile glass"></div>
                    <div class="tile glass"></div>
                    <div class="tile glass"></div>
                </div>
            </section>

            <section aria-label="Section">
                <div class="section-head" aria-hidden="true"><span class="heading-placeholder"></span><span class="heading-placeholder small"></span></div>
                <div class="card-grid">
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                    <div class="placeholder-card glass" aria-hidden="true"><div class="card-top"></div><div class="card-line"></div><div class="card-line thin"></div></div>
                </div>
            </section>
        </main>

        <footer class="glass" aria-label="Footer">
            <span class="footer-mark" aria-hidden="true"></span>
            <div class="footer-items" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="header-orb" aria-hidden="true"></div>
        </footer>
    </div>

    <script>
    (() => {
      "use strict";
      const canvas = document.getElementById("glass-gpu");
      const gl = canvas.getContext("webgl", { alpha: true, antialias: true, premultipliedAlpha: false, powerPreference: "high-performance" });
      const image = document.getElementById("wallpaper");
      const panels = [...document.querySelectorAll(".glass")];
      if (!gl) {
        console.warn("WebGL is unavailable; home2 uses the normal transparent panel fallback.");
        return;
      }

      const vertexSource = `
        attribute vec2 a_position;
        uniform vec4 u_rect;
        uniform vec2 u_viewport;
        varying vec2 v_local;
        void main() {
          v_local = a_position;
          vec2 pixel = u_rect.xy + a_position * u_rect.zw;
          vec2 clip = (pixel / u_viewport) * 2.0 - 1.0;
          gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
        }`;
      const fragmentSource = `
        precision mediump float;
        uniform sampler2D u_wallpaper;
        uniform vec2 u_viewport;
        uniform vec2 u_imageSize;
        uniform vec2 u_panelSize;
        uniform float u_radius;
        uniform float u_refraction;
        uniform float u_edge;
        uniform float u_velocity;
        varying vec2 v_local;

        float roundedBoxSDF(vec2 p, vec2 b, float r) {
          vec2 q = abs(p) - b + vec2(r);
          return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
        }
        vec2 screenUv(vec2 topLeftPixel) {
          float screenAspect = u_viewport.x / u_viewport.y;
          float imageAspect = u_imageSize.x / u_imageSize.y;
          vec2 uv = topLeftPixel / u_viewport;
          if (imageAspect > screenAspect) {
            float visibleWidth = screenAspect / imageAspect;
            uv.x = (uv.x - 0.5) * visibleWidth + 0.5;
          } else {
            float visibleHeight = imageAspect / screenAspect;
            uv.y = (uv.y - 0.5) * visibleHeight + 0.5;
          }
          return vec2(uv.x, 1.0 - uv.y);
        }
        void main() {
          vec2 localPx = v_local * u_panelSize;
          vec2 centered = localPx - u_panelSize * 0.5;
          float radius = min(u_radius, min(u_panelSize.x, u_panelSize.y) * 0.5);
          float sdf = roundedBoxSDF(centered, u_panelSize * 0.5, radius);
          if (sdf > 0.0) discard;

          float edgeWidth = max(2.0, min(u_panelSize.x, u_panelSize.y) * u_edge);
          float edge = 1.0 - smoothstep(0.0, edgeWidth, -sdf);
          float nx = centered.x / max(1.0, u_panelSize.x * 0.5);
          float ny = centered.y / max(1.0, u_panelSize.y * 0.5);
          vec2 radial = normalize(centered + vec2(0.001));
          float rim = pow(edge, 1.7);
          float moving = clamp(u_velocity, -1.0, 1.0);

          // Refraction grows around the curved perimeter. Scroll velocity adds
          // a small elastic directional bend instead of hiding the glass layer.
          vec2 offset = vec2(nx, ny) * rim * u_refraction * min(u_panelSize.x, u_panelSize.y) * 0.18;
          offset += vec2(moving * rim * 12.0, -moving * rim * 3.0);
          vec2 panelTopLeft = gl_FragCoord.xy - localPx;
          vec2 topOrigin = vec2(panelTopLeft.x, u_viewport.y - panelTopLeft.y - u_panelSize.y);
          vec2 samplePixel = topOrigin + localPx + offset;
          vec4 color = texture2D(u_wallpaper, screenUv(clamp(samplePixel, vec2(0.0), u_viewport)));
          float luminance = dot(color.rgb, vec3(0.2126, 0.7152, 0.0722));
          color.rgb = mix(color.rgb, color.rgb * 1.06 + vec3(0.025), 0.28);
          float highlight = pow(max(0.0, 1.0 - abs(sdf) / edgeWidth), 2.0);
          float topLight = (1.0 - v_local.y) * 0.055;
          color.rgb += vec3(highlight * 0.17 + topLight);
          color.rgb = mix(color.rgb, vec3(1.0), edge * 0.075);
          color.a = 0.99;
          gl_FragColor = color;
        }`;

      function compile(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error("home2 shader error:", gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }
      const vs = compile(gl.VERTEX_SHADER, vertexSource);
      const fs = compile(gl.FRAGMENT_SHADER, fragmentSource);
      if (!vs || !fs) return;
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error("home2 WebGL link error:", gl.getProgramInfoLog(program));
        return;
      }
      gl.useProgram(program);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, "a_position");
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      const uniform = name => gl.getUniformLocation(program, name);
      const U = {
        rect: uniform("u_rect"), viewport: uniform("u_viewport"),
        imageSize: uniform("u_imageSize"), panelSize: uniform("u_panelSize"),
        radius: uniform("u_radius"), refraction: uniform("u_refraction"),
        edge: uniform("u_edge"), velocity: uniform("u_velocity"),
        wallpaper: uniform("u_wallpaper")
      };

      const texture = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.uniform1i(U.wallpaper, 0);

      let imageReady = false;
      function uploadWallpaper() {
        if (!image.complete || !image.naturalWidth) return;
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
        imageReady = true;
        requestRender();
      }
      image.addEventListener("load", uploadWallpaper);
      if (image.complete && image.naturalWidth) uploadWallpaper();

      let dpr = 1, lastScrollY = window.scrollY, scrollVelocity = 0, targetVelocity = 0;
      let frame = 0, active = false, lastTime = performance.now();
      const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const w = Math.max(1, Math.round(window.innerWidth * dpr));
        const h = Math.max(1, Math.round(window.innerHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w; canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
        requestRender();
      }
      function requestRender() {
        if (!frame) frame = requestAnimationFrame(render);
      }
      function visible(rect) {
        return rect.bottom > 0 && rect.top < innerHeight && rect.right > 0 && rect.left < innerWidth;
      }
      function render(now) {
        frame = 0;
        if (!imageReady) return;
        const dt = Math.min(0.04, Math.max(0.001, ((now || performance.now()) - lastTime) / 1000));
        lastTime = now || performance.now();
        scrollVelocity += (targetVelocity - scrollVelocity) * Math.min(1, dt * 13);
        targetVelocity *= Math.pow(0.045, dt);
        if (Math.abs(scrollVelocity) < 0.002) scrollVelocity = 0;

        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.uniform2f(U.viewport, canvas.width, canvas.height);
        gl.uniform2f(U.imageSize, image.naturalWidth, image.naturalHeight);

        let hasVisible = false;
        for (const panel of panels) {
          const r = panel.getBoundingClientRect();
          if (!visible(r)) continue;
          hasVisible = true;
          const x = r.left * dpr;
          const y = (innerHeight - r.bottom) * dpr;
          const w = r.width * dpr, h = r.height * dpr;
          if (w < 2 || h < 2) continue;
          const style = getComputedStyle(panel);
          const radius = parseFloat(style.borderTopLeftRadius) || 18;
          const refraction = clamp(parseFloat(style.getPropertyValue("--glass-refraction")) || 0.48, 0.1, 1);
          const edgeRaw = style.getPropertyValue("--glass-edge").trim();
          const edge = edgeRaw.endsWith("%") ? parseFloat(edgeRaw) / 100 : clamp(parseFloat(edgeRaw) || 0.24, 0.02, 0.8);
          gl.uniform4f(U.rect, x, y, w, h);
          gl.uniform2f(U.panelSize, w, h);
          gl.uniform1f(U.radius, radius * dpr);
          gl.uniform1f(U.refraction, refraction);
          gl.uniform1f(U.edge, edge);
          gl.uniform1f(U.velocity, clamp(scrollVelocity * 0.018, -1, 1));
          gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
        // Continue only while the elastic scroll response is settling; ordinary
        // scroll/resize events schedule the next frame, so idle pages stay idle.
        if (hasVisible && (Math.abs(scrollVelocity) > 0.002 || Math.abs(targetVelocity) > 0.002)) requestRender();
      }
      function onScroll() {
        const y = window.scrollY;
        const delta = y - lastScrollY;
        lastScrollY = y;
        targetVelocity = clamp(delta / Math.max(1, innerHeight * 0.18), -1, 1);
        requestRender();
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", resize, { passive: true });
      document.querySelectorAll(".carousel").forEach(el => el.addEventListener("scroll", requestRender, { passive: true }));
      if ("ResizeObserver" in window) {
        const ro = new ResizeObserver(requestRender);
        panels.forEach(panel => ro.observe(panel));
      }
      resize();
      requestRender();
    })();
    </script>
</body>
</html>
